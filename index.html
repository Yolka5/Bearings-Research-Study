<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מיסבים</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(ellipse 60% 70% at 50% 50%, #dcdcdc 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 50% 45%, #cfc8b8 0%, transparent 55%),
      #ffffff;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  #canvas-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    background: transparent;
  }

  #canvas-container canvas {
    display: block;
  }

  .bg-title {
    position: fixed;
    top: 50%;
    left: 50%;
    z-index: 0;
    margin: 0;
    font-family: Arial, sans-serif;
    font-weight: 700;
    font-size: min(22vw, 300px);
    color: #e7e2d8;
    letter-spacing: -0.02em;
    white-space: nowrap;
    user-select: none;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.85);
    animation: title-pop 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
  }

  @keyframes title-pop {
    0% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.85);
      filter: blur(6px);
    }
    60% {
      opacity: 1;
      filter: blur(0);
    }
    100% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      filter: blur(0);
    }
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<h1 class="bg-title">מיסבים</h1>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

  const container = document.getElementById('canvas-container');

  const scene = new THREE.Scene();
  scene.background = null;

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 5);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  // Environment map gives the metal/anodized surfaces something to reflect
  // instead of rendering as flat, unlit color swatches.
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  // Lighting
  const hemiLight = new THREE.HemisphereLight(0xffffff, 0xe0e0e0, 0.6);
  scene.add(hemiLight);

  const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
  keyLight.position.set(4, 6, 6);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(1024, 1024);
  keyLight.shadow.camera.near = 1;
  keyLight.shadow.camera.far = 15;
  keyLight.shadow.radius = 4;
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
  fillLight.position.set(-5, -2, 3);
  scene.add(fillLight);

  // Soft blurred contact shadow under the model
  const shadowGeo = new THREE.PlaneGeometry(4, 4);
  const shadowMat = new THREE.ShadowMaterial({ opacity: 0.18 });
  const shadowPlane = new THREE.Mesh(shadowGeo, shadowMat);
  shadowPlane.rotation.x = -Math.PI / 2;
  shadowPlane.position.set(0, -1.1, 0);
  shadowPlane.receiveShadow = true;
  scene.add(shadowPlane);

  let bearingModel = null;

  function positionModel(object) {
    // Center the model and place it to the right side of the screen
    const box = new THREE.Box3().setFromObject(object);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    object.position.x += (object.position.x - center.x);
    object.position.y += (object.position.y - center.y);
    object.position.z += (object.position.z - center.z);

    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 2.6 / maxDim;
    object.scale.setScalar(scale);
  }

  const loader = new GLTFLoader();
  loader.load(
    'Bearing.gltf',
    (gltf) => {
      bearingModel = gltf.scene;
      positionModel(bearingModel);

      // Source materials come in flat (metalness 0) -> nothing to reflect,
      // no shadow. Push them toward brushed metal so lighting/env map show up.
      bearingModel.traverse((child) => {
        if (child.isMesh) {
          child.material.metalness = 0.85;
          child.material.roughness = 0.35;
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });

      scene.add(bearingModel);
    },
    undefined,
    (error) => {
      console.error('Error loading Bearing.gltf:', error);
    }
  );

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener('resize', onWindowResize);

  function animate() {
    requestAnimationFrame(animate);
    if (bearingModel) {
      bearingModel.rotation.y += 0.012;
    }
    renderer.render(scene, camera);
  }
  animate();
</script>

</body>
</html>
